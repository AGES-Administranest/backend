services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Emulador de AWS (Cognito + S3) — ver docs/ADRs/ADR-12.
  ministack:
    image: ministackorg/ministack:latest
    restart: unless-stopped
    ports:
      - '${MINISTACK_PORT:-4566}:4566'
    environment:
      MINISTACK_REGION: us-east-1
      LOG_LEVEL: INFO
      PERSIST_STATE: '1'
      S3_PERSIST: '1'
    volumes:
      - ./docker/ministack-data/state:/tmp/ministack-state
      - ./docker/ministack-data/s3:/tmp/ministack-data/s3
    # A imagem já define um healthcheck próprio em /_ministack/health; é ele
    # que o `depends_on: service_healthy` do aws-cli espera.

  # Faz o papel do Google no login social local — ver ADR-13.
  # O MiniStack não implementa o provedor nativo `Google`, só OIDC genérico; o
  # bootstrap registra um OIDC com esse nome apontando para cá, então o app
  # pede `identity_provider=Google` igual faria em produção.
  # Na tela de login dele, digite um e-mail no campo de usuário: vira o `sub`
  # e o e-mail da conta.
  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    restart: unless-stopped
    ports:
      - '${OIDC_MOCK_PORT:-8090}:8080'
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: '{"interactiveLogin": true}'

  # Só existe para rodar os scripts de bootstrap. Não sobe no `docker compose up`.
  aws-cli:
    image: amazon/aws-cli:latest
    profiles: [bootstrap]
    entrypoint: /bin/bash
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # URL que a API e o app usam a partir do host (fora da rede do Compose).
      HOST_ENDPOINT_URL: http://localhost:${MINISTACK_PORT:-4566}
      # Nomes dos recursos que o bootstrap cria. Ficam aqui, e não dentro dos
      # scripts, para que bootstrap-aws.sh e dev-token.sh leiam o MESMO valor.
      # Destes, só o S3_BUCKET chega na API — ver docs/ambiente-local.md.
      COGNITO_POOL_NAME: ${COGNITO_POOL_NAME:-administranest-local}
      COGNITO_CLIENT_NAME: ${COGNITO_CLIENT_NAME:-administranest-mobile}
      S3_BUCKET: ${S3_BUCKET:-administranest-local}
      DEV_EMAIL: ${DEV_EMAIL:-dev@administranest.local}
      DEV_PASSWORD: ${DEV_PASSWORD:-Dev@12345}
      DEV_NAME: ${DEV_NAME:-Dev Local}
      # Login social (ADR-13). O navegador do usuário chega no IdP fake pelo
      # host; o MiniStack troca o código com ele por dentro da rede do Compose.
      COGNITO_DOMAIN_PREFIX: ${COGNITO_DOMAIN_PREFIX:-administranest-local}
      OIDC_MOCK_HOST_URL: http://localhost:${OIDC_MOCK_PORT:-8090}
      OIDC_MOCK_INTERNAL_URL: http://oidc-mock:8080
      # Para onde o Cognito devolve o app depois do login. Tem que bater
      # exatamente com o redirect_uri que o app envia: o scheme do build
      # nativo, o Expo Go no simulador e o Expo web. Expo Go num celular físico
      # usa o IP da sua rede — acrescente `exp://<ip>:8081/--/auth/callback`
      # no seu .env e rode o bootstrap de novo.
      COGNITO_CALLBACK_URLS: ${COGNITO_CALLBACK_URLS:-administranest://auth/callback,exp://127.0.0.1:8081/--/auth/callback,http://localhost:8081/auth/callback}
      COGNITO_LOGOUT_URLS: ${COGNITO_LOGOUT_URLS:-administranest://auth/signed-out,exp://127.0.0.1:8081/--/auth/signed-out,http://localhost:8081/auth/signed-out}
    volumes:
      - ./scripts:/scripts:ro
      - ./:/workspace

volumes:
  postgres_data:
